<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - moded by Pretvfx</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            padding: 24px;
            text-align: center;
        }

        .header h2 {
            font-size: 1.4rem;
            color: #0f172a;
            font-weight: 700;
        }

        .header p {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 24px;
        }

        .notice-box {
            background-color: #fffbeb;
            border: 1px solid #fde68a;
            color: #b45309;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        .notice-box.success {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .notice-box .icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .qris-preview {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #334155;
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-logout {
            background-color: #fef2f2;
            color: #991b1b;
            margin-top: 25px;
            border: 1px solid #fee2e2;
        }

        .btn-logout:hover {
            background-color: #fee2e2;
        }

        .hidden {
            display: none !important;
        }

        /* Gallery History */
        .history-section {
            margin-top: 30px;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .history-header h3 {
            font-size: 1.05rem;
            color: #0f172a;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 4px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .history-item {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .history-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .history-item img:hover {
            opacity: 0.9;
        }

        .history-item .info {
            padding: 8px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .history-item p {
            font-size: 0.75rem;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .badge-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            font-size: 0.62rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .badge-web { background-color: #e0f2fe; color: #0369a1; }

        .time-text {
            font-size: 0.62rem;
            color: #94a3b8;
        }

        .status-box-pending {
            display: block;
            text-align: center;
            background-color: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 600;
            margin-top: 8px;
            line-height: 1.3;
        }

        .status-box-completed {
            display: block;
            text-align: center;
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 600;
            margin-top: 8px;
            line-height: 1.3;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
        }

        .status.success { color: #16a34a; }
        .status.error { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="titleHeader">Generate Theme Qris</h2>
        <p>moded by Pretvfx</p>
    </div>

    <div class="content">
        <!-- FORM LOGIN -->
        <div id="loginSection">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="usernameInput" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="Masukkan password">
            </div>
            <button class="btn" onclick="handleLogin()">Masuk</button>
            <div id="loginStatus" class="status error"></div>
        </div>

        <!-- DASHBOARD PANEL -->
        <div id="dashboardSection" class="hidden">
            
            <!-- NOTICE STATUS QRIS AUTOMATIC -->
            <div class="notice-box" id="noticeBox">
                <span class="icon" id="noticeIcon">⏳</span>
                <div id="noticeContent">
                    <strong>Pemberitahuan:</strong> Harap tunggu proses QR Code, biasanya memakan waktu sekitar <strong>5 - 10 menit</strong>.
                </div>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label>Pilih Foto (Bisa Kirim Banyak/3 Foto)</label>
                    <input type="file" id="imageInput" accept="image/*" multiple required>
                </div>
                <div class="form-group">
                    <label>Pesan / Teks Caption</label>
                    <textarea id="captionInput" rows="3" placeholder="Request Theme"></textarea>
                </div>
                <button type="submit" class="btn" id="sendBtn">Membuat</button>
            </form>
            
            <div id="sendStatus" class="status"></div>

            <!-- GALLERY HISTORY -->
            <div class="history-section">
                <div class="history-header">
                    <h3>History Gambar</h3>
                    <span style="font-size:0.75rem; color:#64748b;">
                        <span class="live-dot"></span>Live Sync
                    </span>
                </div>
                <div class="history-grid" id="historyGrid"></div>
            </div>

            <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // PASTE URL CLOUDFLARE TUNNEL DI BAWAH INI (Satu tempat saja):
    // =========================================================================
    const API_URL = "https://compatibility-bicycle-relates-computed.trycloudflare.com";
    // =========================================================================

    let syncInterval = null;

    const getBaseUrl = () => {
        if (!API_URL || API_URL.includes("TARUH-LINK-CLOUDFLARE-DISINI")) {
            return window.location.origin;
        }
        return API_URL.replace(/\/$/, "");
    };

    async function handleLogin() {
        const user = document.getElementById('usernameInput').value;
        const pass = document.getElementById('passwordInput').value;
        const status = document.getElementById('loginStatus');

        try {
            const res = await fetch(`${getBaseUrl()}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            const data = await res.json();

            if (data.success) {
                status.textContent = "";
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('titleHeader').textContent = "Generate Thema Qr";
                
                fetchHistory();
                checkQrisStatus();
                syncInterval = setInterval(() => {
                    fetchHistory();
                    checkQrisStatus();
                }, 3000);
            } else {
                status.textContent = data.message;
            }
        } catch (e) {
            status.textContent = "Gagal terhubung ke Server!";
        }
    }

    function handleLogout() {
        if (syncInterval) clearInterval(syncInterval);
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('titleHeader').textContent = "Login System";
        document.getElementById('usernameInput').value = "";
        document.getElementById('passwordInput').value = "";
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const imageFiles = document.getElementById('imageInput').files;
        const caption = document.getElementById('captionInput').value;
        const statusDiv = document.getElementById('sendStatus');
        const sendBtn = document.getElementById('sendBtn');

        if (imageFiles.length === 0) return;

        sendBtn.disabled = true;
        sendBtn.textContent = `Mengirim ${imageFiles.length} Foto...`;
        statusDiv.className = "status";
        statusDiv.textContent = "";

        const formData = new FormData();
        for (let i = 0; i < imageFiles.length; i++) {
            formData.append('image', imageFiles[i]);
        }
        formData.append('caption', caption);

        try {
            const res = await fetch(`${getBaseUrl()}/api/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            if (data.success) {
                statusDiv.className = "status success";
                statusDiv.textContent = data.message;
                document.getElementById('uploadForm').reset();
                fetchHistory();
            } else {
                throw new Error(data.message);
            }
        } catch (err) {
            statusDiv.className = "status error";
            statusDiv.textContent = "Error: " + err.message;
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = "Membuat";
        }
    });

    async function checkQrisStatus() {
        try {
            const res = await fetch(`${getBaseUrl()}/api/qris-status`);
            const data = await res.json();
            const noticeBox = document.getElementById('noticeBox');
            const noticeIcon = document.getElementById('noticeIcon');
            const noticeContent = document.getElementById('noticeContent');

            if (data.ready) {
                noticeBox.className = "notice-box success";
                noticeIcon.textContent = "✅";
                
                let html = `<strong>Status:</strong> ${data.message}`;
                if (data.imageUrl) {
                    const fullImgUrl = data.imageUrl.startsWith('http') ? data.imageUrl : `${getBaseUrl()}${data.imageUrl}`;
                    html += `<br><img src="${fullImgUrl}" class="qris-preview" alt="QRIS">`;
                }
                noticeContent.innerHTML = html;
            } else {
                noticeBox.className = "notice-box";
                noticeIcon.textContent = "⏳";
                noticeContent.innerHTML = `<strong>Pemberitahuan:</strong> Harap tunggu proses Pembuatan Thema QR Code, biasanya memakan waktu sekitar <strong>5 - 10 menit</strong>.`;
            }
        } catch (e) {
            console.error("Gagal mengambil status QRIS:", e);
        }
    }

    async function fetchHistory() {
        try {
            const res = await fetch(`${getBaseUrl()}/api/history`);
            const data = await res.json();
            renderHistory(data);
        } catch (e) {
            console.error("Gagal mengambil history:", e);
        }
    }

    function renderHistory(history) {
        const grid = document.getElementById('historyGrid');
        grid.innerHTML = "";
        
        if (!history || history.length === 0) {
            grid.innerHTML = "<p style='font-size: 0.8rem; color: #94a3b8; grid-column: 1/-1;'>Belum ada history gambar.</p>";
            return;
        }

        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            
            const fullImgUrl = item.url.startsWith('http') ? item.url : `${getBaseUrl()}${item.url}`;

            const isPending = item.status === 'pending' || !item.status;
            const statusClass = isPending ? 'status-box-pending' : 'status-box-completed';
            const statusText = item.statusText || (isPending ? '⏳ Tema sedang dibuat, mohon tunggu' : '✅ Tema QRIS telah dibuat');

            div.innerHTML = `
                <img src="${fullImgUrl}" alt="Foto" onclick="window.open('${fullImgUrl}', '_blank')">
                <div class="info">
                    <div>
                        <p title="${item.caption}">${item.caption}</p>
                        <div class="badge-container">
                            <span class="badge badge-web">WEB</span>
                            <span class="time-text">${item.time || ''}</span>
                        </div>
                    </div>
                    <div class="${statusClass}">${statusText}</div>
                </div>
            `;
            grid.appendChild(div);
        });
    }
</script>

</body>
</html>

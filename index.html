<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI QR Code Generator - moded by Pretvfx</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 12px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            padding: 20px 24px;
            text-align: center;
        }

        .header h2 {
            font-size: 1.4rem;
            color: #0f172a;
            font-weight: 700;
        }

        .header p {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 2px;
            font-weight: 600;
        }

        .content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preview-item {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #334155; }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .btn-logout {
            background-color: #fef2f2;
            color: #dc2626;
            margin-top: 24px;
            border: 1px solid #fee2e2;
        }
        .btn-logout:hover { background-color: #fee2e2; }

        .hidden { display: none !important; }

        .alert-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 14px;
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }

        /* MANAJEMEN AKSES AKUN */
        .access-section {
            margin-top: 24px;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }

        .access-section h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 12px;
        }

        .access-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
        }

        .access-table th, .access-table td {
            padding: 8px 10px;
            border: 1px solid #e2e8f0;
        }

        .access-table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
        }

        .badge-role-owner {
            color: #1d4ed8;
            background: #dbeafe;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .badge-role-member {
            color: #475569;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-expired {
            color: #dc2626;
            background: #fef2f2;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-active {
            color: #166534;
            background: #f0fdf4;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .output-section {
            margin-top: 22px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 18px;
        }

        .output-header {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .output-container-list {
            display: flex;
            flex-direction: row;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .output-container-list::-webkit-scrollbar { height: 4px; }
        .output-container-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .result-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            width: 100%;
            min-width: 100%;
            flex: 0 0 100%;
            scroll-snap-align: start;
        }

        .badge-status-green {
            display: inline-block;
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .badge-status-yellow {
            display: inline-block;
            background-color: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .result-card .caption-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .result-card img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid #f1f5f9;
        }

        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-act-main {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            transition: opacity 0.2s;
        }
        .btn-act-main:hover { opacity: 0.9; }

        .btn-download-main {
            background-color: #0f172a;
            color: #ffffff;
        }

        .btn-delete-main {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
        }

        .history-section {
            margin-top: 20px;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header h3 {
            font-size: 0.9rem;
            color: #0f172a;
            font-weight: 700;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 4px;
        }

        .history-grid {
            display: flex;
            flex-direction: row;
            gap: 8px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .history-grid::-webkit-scrollbar { height: 4px; }
        .history-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .history-item {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            flex: 0 0 calc(25% - 6px);
            min-width: 100px;
            scroll-snap-align: start;
        }

        .history-item img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
        }

        .history-item .info {
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .history-item p {
            font-size: 0.68rem;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .btn-delete-sm {
            width: 100%;
            padding: 4px;
            font-size: 0.65rem;
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
            border-radius: 4px;
            cursor: pointer;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }
        .status-msg.error { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 id="titleHeader">Generate Thema Qr</h2>
        <p>moded by Kingz Store</p>
    </div>

    <div class="content">
        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="usernameInput" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passwordInput" placeholder="Masukkan password">
            </div>
            <button class="btn" onclick="handleLogin()">Masuk</button>
            <div id="loginStatus" class="status-msg error"></div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="hidden">
            
            <!-- FORM INPUT GENERATE -->
            <form id="uploadForm">
                <div class="form-group">
                    <label>Pilih Foto Qris Yang ingin di jdikan tema</label>
                    <input type="file" id="imageInput" accept="image/*" multiple required>
                    <div id="imagePreviewContainer" class="preview-container"></div>
                </div>
                <div class="form-group">
                    <label>Pesan / Teks Caption</label>
                    <textarea id="captionInput" rows="2" placeholder="Request Theme"></textarea>
                </div>
                <button type="submit" class="btn" id="sendBtn">Membuat</button>
            </form>
            
            <!-- NOTIFIKASI SETELAH MENGIRIM -->
            <div id="notifBox" class="hidden"></div>

            <!-- HASIL GENERATE UTAMA -->
            <div class="output-section">
                <div class="output-header">
                    <span>✨ Hasil Generate Baru</span>
                    <span style="font-size:0.75rem; color:#64748b;">
                        <span class="live-dot"></span>Live Sync
                    </span>
                </div>
                <div id="outputContainer" class="output-container-list"></div>
            </div>

            <!-- HISTORY HASIL GENERATE QR -->
            <div class="history-section">
                <div class="history-header">
                    <h3>🎨 History Hasil Generate QR</h3>
                </div>
                <div class="history-grid" id="historyHasilGrid"></div>
            </div>

            <!-- HISTORY REQUEST FOTO -->
            <div class="history-section">
                <div class="history-header">
                    <h3>📚 History Request Foto</h3>
                </div>
                <div class="history-grid" id="historyGrid"></div>
            </div>

            <!-- MANAJEMEN AKSES AKUN (HANYA MUNCUL DILOGIN ROLE KEPEMILIKAN) -->
            <div id="accessManagementSection" class="access-section hidden">
                <h3>🔑 Kelola Akses Akun</h3>
                
                <form id="addAccountForm" onsubmit="handleAddAccount(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="accUsername" placeholder="User Baru" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="text" id="accPassword" placeholder="PW" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Akses Peran (Role)</label>
                            <select id="accRole" required>
                                <option value="member">Member</option>
                                <option value="kepemilikan">Kepemilikan</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Durasi Akses (Hari)</label>
                            <input type="number" id="accDuration" placeholder="30" min="1" required>
                        </div>
                    </div>
                    <button type="submit" class="btn" style="background-color: #2563eb;">+ Tambah Akses</button>
                </form>

                <!-- TABEL AKSES -->
                <div class="table-responsive">
                    <table class="access-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>PW</th>
                                <th>Role</th>
                                <th>Kedaluwarsa</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="accountTableBody">
                            <tr>
                                <td colspan="6" style="text-align:center;">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://zshops-star-possession-carb.trycloudflare.com";

    let syncInterval = null;
    let loadedInitial = false;
    let seenIds = JSON.parse(localStorage.getItem('seen_ids') || '[]');

    const getBaseUrl = () => {
        if (!API_URL || API_URL.includes("TARUH-LINK-CLOUDFLARE-DISINI")) {
            return window.location.origin;
        }
        return API_URL.replace(/\/$/, "");
    };

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const previewContainer = document.getElementById('imagePreviewContainer');
        previewContainer.innerHTML = '';

        const files = e.target.files;
        if (files && files.length > 0) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.innerHTML = `<img src="${evt.target.result}" alt="Preview Foto">`;
                        previewContainer.appendChild(div);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('isLoggedIn') === 'true') {
            showDashboard();
        }
    });

    function showDashboard() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        
        const userRole = localStorage.getItem('userRole') || 'member';
        const accessSec = document.getElementById('accessManagementSection');

        // Pengecekan Peran: Kepemilikan bisa mengelola akses, Member tidak
        if (userRole === 'kepemilikan') {
            accessSec.classList.remove('hidden');
            fetchAccounts();
        } else {
            accessSec.classList.add('hidden');
        }

        loadLocalHistory();
        fetchHistory();
        if (!syncInterval) {
            syncInterval = setInterval(fetchHistory, 3000);
        }
    }

    function loadLocalHistory() {
        const localData = localStorage.getItem('app_history');
        if (localData) {
            try {
                const parsed = JSON.parse(localData);
                renderDashboard(parsed);
            } catch (e) {
                console.error("Error load local cache:", e);
            }
        }
    }

    function saveLocalHistory(data) {
        localStorage.setItem('app_history', JSON.stringify(data));
    }

    async function handleLogin() {
        const user = document.getElementById('usernameInput').value;
        const pass = document.getElementById('passwordInput').value;
        const status = document.getElementById('loginStatus');

        try {
            const res = await fetch(`${getBaseUrl()}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            const data = await res.json();

            if (data.success) {
                status.textContent = "";
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', data.role);
                showDashboard();
            } else {
                status.textContent = data.message;
            }
        } catch (e) {
            status.textContent = "Gagal terhubung ke Server!";
        }
    }

    function handleLogout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userRole');
        if (syncInterval) {
            clearInterval(syncInterval);
            syncInterval = null;
        }
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('usernameInput').value = "";
        document.getElementById('passwordInput').value = "";
    }

    // MANAJEMEN AKSES (KHUSUS KEPEMILIKAN)
    async function fetchAccounts() {
        try {
            const res = await fetch(`${getBaseUrl()}/api/accounts`);
            const result = await res.json();
            
            if (result.success) {
                renderAccountTable(result.data);
            }
        } catch (err) {
            console.error("Gagal memuat akun akses:", err);
        }
    }

    function renderAccountTable(accounts) {
        const tbody = document.getElementById('accountTableBody');
        tbody.innerHTML = '';

        if (!accounts || accounts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada akun tambahan.</td></tr>';
            return;
        }

        const now = new Date();

        accounts.forEach(acc => {
            const expireDate = new Date(acc.expires_at);
            const isExpired = expireDate < now;
            const isKepemilikan = acc.role === 'kepemilikan';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${acc.username}</strong></td>
                <td>${acc.password}</td>
                <td>
                    <span class="${isKepemilikan ? 'badge-role-owner' : 'badge-role-member'}">
                        ${isKepemilikan ? 'Kepemilikan' : 'Member'}
                    </span>
                </td>
                <td>${expireDate.toLocaleDateString('id-ID')}</td>
                <td>
                    <span class="${isExpired ? 'badge-expired' : 'badge-active'}">
                        ${isExpired ? 'Habis' : 'Aktif'}
                    </span>
                </td>
                <td>
                    <button onclick="deleteAccount('${acc.id}')" class="btn-delete-sm">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function handleAddAccount(e) {
        e.preventDefault();
        const username = document.getElementById('accUsername').value;
        const password = document.getElementById('accPassword').value;
        const role = document.getElementById('accRole').value;
        const durationDays = document.getElementById('accDuration').value;

        try {
            const res = await fetch(`${getBaseUrl()}/api/accounts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role, durationDays })
            });

            const data = await res.json();
            if (data.success) {
                alert("Akses Akun Berhasil Ditambahkan!");
                document.getElementById('addAccountForm').reset();
                fetchAccounts();
            } else {
                alert("Gagal: " + data.message);
            }
        } catch (err) {
            alert("Terjadi kesalahan sistem!");
        }
    }

    async function deleteAccount(id) {
        if (!confirm("Hapus akses akun ini?")) return;

        try {
            const res = await fetch(`${getBaseUrl()}/api/accounts/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                fetchAccounts();
            } else {
                alert("Gagal menghapus: " + data.message);
            }
        } catch (err) {
            alert("Terjadi kesalahan jaringan!");
        }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const imageFiles = document.getElementById('imageInput').files;
        const caption = document.getElementById('captionInput').value;
        const sendBtn = document.getElementById('sendBtn');
        const notifBox = document.getElementById('notifBox');

        if (imageFiles.length === 0) return;

        sendBtn.disabled = true;
        sendBtn.textContent = "Mengirim...";
        notifBox.classList.add('hidden');

        const formData = new FormData();
        for (let i = 0; i < imageFiles.length; i++) {
            formData.append('image', imageFiles[i]);
        }
        formData.append('caption', caption);

        try {
            const res = await fetch(`${getBaseUrl()}/api/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            if (data.success) {
                notifBox.className = "alert-box";
                notifBox.innerHTML = `✅ <strong>${imageFiles.length} foto berhasil dikirim!</strong><br>Harap tunggu proses pembuatan Tema QR Code (estimasi <strong>5 - 10 menit</strong>).`;
                notifBox.classList.remove('hidden');

                document.getElementById('uploadForm').reset();
                document.getElementById('imagePreviewContainer').innerHTML = '';
                
                fetchHistory();
            } else {
                throw new Error(data.message);
            }
        } catch (err) {
            notifBox.className = "status-msg error";
            notifBox.textContent = "Error: " + err.message;
            notifBox.classList.remove('hidden');
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = "Membuat";
        }
    });

    async function fetchHistory() {
        try {
            const res = await fetch(`${getBaseUrl()}/api/history`);
            const data = await res.json();
            
            saveLocalHistory(data);
            renderDashboard(data);
        } catch (e) {
            console.warn("Server offline, memuat dari local cache...", e);
            loadLocalHistory();
        }
    }

    async function deleteHistory(id) {
        if (!confirm("Apakah Anda yakin ingin menghapus foto ini?")) return;

        try {
            const res = await fetch(`${getBaseUrl()}/api/history/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) fetchHistory();
        } catch (e) {
            const localData = localStorage.getItem('app_history');
            if (localData) {
                let parsed = JSON.parse(localData);
                parsed = parsed.filter(item => item.id !== id);
                saveLocalHistory(parsed);
                renderDashboard(parsed);
            }
        }
    }

    function dismissBigCard(id) {
        if (!seenIds.includes(id)) {
            seenIds.push(id);
            localStorage.setItem('seen_ids', JSON.stringify(seenIds));
        }
        fetchHistory();
    }

    function renderDashboard(history) {
        const outputContainer = document.getElementById('outputContainer');
        const historyHasilGrid = document.getElementById('historyHasilGrid');
        const historyGrid = document.getElementById('historyGrid');

        outputContainer.innerHTML = "";
        historyHasilGrid.innerHTML = "";
        historyGrid.innerHTML = "";

        if (!history || history.length === 0) {
            outputContainer.innerHTML = `
                <div class="result-card">
                    <span class="badge-status-yellow">⏳ Belum Ada Hasil Generate</span>
                    <p style="font-size:0.8rem; color:#64748b; margin-top:6px;">Silakan upload foto terlebih dahulu.</p>
                </div>
            `;
            historyHasilGrid.innerHTML = "<p style='font-size:0.75rem; color:#94a3b8; grid-column:1/-1;'>Belum ada history hasil generate.</p>";
            historyGrid.innerHTML = "<p style='font-size:0.75rem; color:#94a3b8; grid-column:1/-1;'>Belum ada history request.</p>";
            return;
        }

        const hasilList = history.filter(item => item.source === 'telegram');
        const requestList = history.filter(item => item.source === 'web');

        if (!loadedInitial && hasilList.length > 0) {
            hasilList.forEach(item => {
                if (!seenIds.includes(item.id)) {
                    seenIds.push(item.id);
                }
            });
            localStorage.setItem('seen_ids', JSON.stringify(seenIds));
            loadedInitial = true;
        }

        const newHasilList = hasilList.filter(item => !seenIds.includes(item.id));

        if (newHasilList.length > 0) {
            newHasilList.forEach(item => {
                const fullImgUrl = item.url.startsWith('http') ? item.url : `${getBaseUrl()}${item.url}`;
                const captionText = item.caption || "Theme telah dibuat";

                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="badge-status-green">✅ Tema QRIS Baru Dibuat</div>
                    <div class="caption-title">"${captionText}"</div>
                    <img src="${fullImgUrl}" alt="Hasil QR Code">
                    <div class="action-row">
                        <a href="${fullImgUrl}" download target="_blank" class="btn-act-main btn-download-main">📥 Download</a>
                        <button onclick="dismissBigCard('${item.id}')" class="btn-act-main btn-delete-main">🗑️ Sembunyikan</button>
                    </div>
                `;
                outputContainer.appendChild(card);
            });
        } else {
            const isPending = history.some(item => item.source === 'web' && item.status === 'pending');
            if (isPending) {
                outputContainer.innerHTML = `
                    <div class="result-card">
                        <div class="badge-status-yellow">⏳ Sedang Dalam Proses</div>
                        <p style="font-size:0.8rem; color:#64748b; margin-top:6px;">Harap tunggu proses pembuatan Tema QR Code (estimasi 5 - 10 menit).</p>
                    </div>
                `;
            } else {
                outputContainer.innerHTML = `
                    <div class="result-card">
                        <span class="badge-status-yellow">✨ Siap Generate QR Code</span>
                        <p style="font-size:0.8rem; color:#64748b; margin-top:6px;">Hasil sebelumnya tersimpan di <strong>History Hasil Generate</strong> di bawah.</p>
                    </div>
                `;
            }
        }

        if (hasilList.length === 0) {
            historyHasilGrid.innerHTML = "<p style='font-size:0.75rem; color:#94a3b8; grid-column:1/-1;'>Belum ada history hasil generate.</p>";
        } else {
            hasilList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const fullImgUrl = item.url.startsWith('http') ? item.url : `${getBaseUrl()}${item.url}`;

                div.innerHTML = `
                    <img src="${fullImgUrl}" alt="Hasil QR" onclick="window.open('${fullImgUrl}', '_blank')">
                    <div class="info">
                        <p title="${item.caption}">🎨 QR Result</p>
                        <div style="display:flex; gap:4px; margin-top:4px;">
                            <a href="${fullImgUrl}" download target="_blank" style="flex:1; text-align:center; background:#0f172a; color:#ffffff; font-size:0.65rem; padding:4px; border-radius:4px; text-decoration:none; font-weight:600;">📥</a>
                            <button onclick="deleteHistory('${item.id}')" class="btn-delete-sm" style="flex:1; margin-top:0;">🗑️</button>
                        </div>
                    </div>
                `;
                historyHasilGrid.appendChild(div);
            });
        }

        if (requestList.length === 0) {
            historyGrid.innerHTML = "<p style='font-size:0.75rem; color:#94a3b8; grid-column:1/-1;'>Belum ada request foto.</p>";
        } else {
            requestList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const fullImgUrl = item.url.startsWith('http') ? item.url : `${getBaseUrl()}${item.url}`;

                div.innerHTML = `
                    <img src="${fullImgUrl}" alt="Foto Request" onclick="window.open('${fullImgUrl}', '_blank')">
                    <div class="info">
                        <p title="${item.caption}">📤 Request</p>
                        <button onclick="deleteHistory('${item.id}')" class="btn-delete-sm">Hapus</button>
                    </div>
                `;
                historyGrid.appendChild(div);
            });
        }
    }
</script>

</body>
</html>
